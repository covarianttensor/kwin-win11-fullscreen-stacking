<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="fsGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <style>
    .font-ui { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Animate Fullscreen Bar jumping between Layer 5 (y=76) and Layer 2 (y=214) */
    @keyframes jumpLayer {
      0%, 42% { transform: translateY(0px); }
      50%, 92% { transform: translateY(138px); }
      100% { transform: translateY(0px); }
    }
    @keyframes stateAOpacity {
      0%, 42% { opacity: 1; }
      48%, 94% { opacity: 0.15; }
      100% { opacity: 1; }
    }
    @keyframes stateBOpacity {
      0%, 44% { opacity: 0.15; }
      50%, 92% { opacity: 1; }
      98%, 100% { opacity: 0.15; }
    }

    .anim-jump { animation: jumpLayer 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .anim-state-a { animation: stateAOpacity 6s linear infinite; }
    .anim-state-b { animation: stateBOpacity 6s linear infinite; }
  </style>

  <rect x="0" y="0" width="900" height="300" rx="12" fill="url(#bg1)" stroke="#1e293b" stroke-width="2"/>

  <text x="24" y="32" class="font-ui" fill="#f8fafc" font-size="15" font-weight="700">
    The EWMH Two-State Dilemma: Why Vanilla KWin Cannot Keep the Taskbar Hidden When Unfocused
  </text>
  <text x="24" y="50" class="font-ui" fill="#94a3b8" font-size="12">
    In EWMH (§7.11), a fullscreen window only has two legal layers— jumping past Layer 3 (Taskbar) every time focus changes:
  </text>

  <!-- LEFT SIDE: KWin Layer Ladder -->
  <g>
    <!-- Layer 5 Slot -->
    <rect x="24" y="68" width="490" height="52" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="38" y="90" class="font-mono" fill="#fcd34d" font-size="12" font-weight="700">Layer 5: ActiveLayer</text>
    <text x="38" y="107" class="font-ui" fill="#94a3b8" font-size="11">Highest app layer (covers Dock &amp; Normal windows)</text>

    <!-- Layer 3 Slot (Taskbar / Dock) -->
    <rect x="24" y="136" width="490" height="52" rx="8" fill="#0c4a6e" fill-opacity="0.45" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="38" y="158" class="font-mono" fill="#38bdf8" font-size="12" font-weight="700">Layer 3: AboveLayer (_NET_WM_TYPE_DOCK)</text>
    <text x="38" y="175" class="font-ui" fill="#bae6fd" font-size="11">Plasma Taskbar / Panel permanently lives here</text>
    <rect x="336" y="146" width="164" height="32" rx="6" fill="#0284c7" stroke="#7dd3fc" stroke-width="1"/>
    <text x="418" y="166" text-anchor="middle" class="font-ui" fill="#ffffff" font-size="11" font-weight="700">Plasma Taskbar (Fixed)</text>

    <!-- Layer 2 Slot (Normal Windows) -->
    <rect x="24" y="204" width="490" height="68" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1"/>
    <text x="38" y="226" class="font-mono" fill="#cbd5e1" font-size="12" font-weight="700">Layer 2: NormalLayer</text>
    <text x="38" y="243" class="font-ui" fill="#94a3b8" font-size="11">Standard windows (Chrome, Discord, Files)</text>
    <rect x="336" y="212" width="164" height="24" rx="5" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <text x="418" y="228" text-anchor="middle" class="font-ui" fill="#f8fafc" font-size="10.5" font-weight="600">Focused Normal Window</text>

    <!-- Animated Fullscreen Window Pill Jumping Between Layer 5 (y=76) and Bottom of Layer 2 (y=214 -> +138px) -->
    <g class="anim-jump">
      <rect x="260" y="76" width="244" height="34" rx="6" fill="url(#fsGrad)" stroke="#c084fc" stroke-width="2"/>
      <text x="382" y="97" text-anchor="middle" class="font-ui" fill="#ffffff" font-size="11.5" font-weight="700">
        Fullscreen App (_NET_WM_STATE_FULLSCREEN)
      </text>
    </g>
  </g>

  <!-- RIGHT SIDE: Resulting Screen Outcome Cards -->
  <g>
    <!-- State 1 Card (ActiveLayer 5) -->
    <g class="anim-state-a">
      <rect x="538" y="68" width="338" height="94" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="554" y="90" class="font-ui" fill="#fcd34d" font-size="12.5" font-weight="700">
        State 1: Fullscreen in ActiveLayer (5)
      </text>
      <text x="554" y="110" class="font-ui" fill="#e2e8f0" font-size="11">
        &#9989; Covers the Plasma Taskbar (Layer 5 &gt; Layer 3)
      </text>
      <text x="554" y="128" class="font-ui" fill="#fca5a5" font-size="11" font-weight="600">
        &#10060; Hides ALL Normal &amp; Keep-Above windows!
      </text>
      <text x="554" y="148" class="font-mono" fill="#a5b4fc" font-size="10">
        isActiveFullScreen() == true
      </text>
    </g>

    <!-- State 2 Card (NormalLayer 2) -->
    <g class="anim-state-b">
      <rect x="538" y="178" width="338" height="94" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="554" y="200" class="font-ui" fill="#7dd3fc" font-size="12.5" font-weight="700">
        State 2: Fullscreen Demoted to NormalLayer (2)
      </text>
      <text x="554" y="220" class="font-ui" fill="#e2e8f0" font-size="11">
        &#9989; Focused Normal Window sits on top (Layer 2)
      </text>
      <text x="554" y="238" class="font-ui" fill="#fca5a5" font-size="11" font-weight="600">
        &#10060; Drops BELOW Taskbar (Layer 2 &lt; Layer 3)!
      </text>
      <text x="554" y="258" class="font-mono" fill="#7dd3fc" font-size="10">
        isActiveFullScreen() == false (Taskbar pops up!)
      </text>
    </g>
  </g>
</svg>
